name: 全国のコンビニ・ヨドバシのデータを更新
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *" # 6時間ごと（取れていない県・古い県だけ取る）
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-japan.yml"
      - "scripts/fetch_japan.py"
permissions:
  contents: write
concurrency:
  group: update-japan
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v7
      - name: 全国のお店データを取得（3県ごとに保存）
        env:
          AUTO_COMMIT: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/fetch_japan.py
