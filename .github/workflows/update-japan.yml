name: 全国のコンビニ・ヨドバシのデータを更新
on:
  workflow_dispatch:
  schedule:
    - cron: "30 17 * * 0" # 毎週月曜 午前2時30分（日本時間）
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-japan.yml"
      - "scripts/fetch_japan.py"
permissions:
  contents: write
concurrency:
  group: update-japan
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: 全国のお店データを取得
        run: python3 scripts/fetch_japan.py
      - name: 変わっていたら保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pref
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "全国のコンビニ・ヨドバシのデータを更新"
          git pull --rebase origin main
          git push
