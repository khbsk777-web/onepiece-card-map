name: 福岡県のコンビニデータを更新
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0" # 毎週月曜 3:00（日本時間）
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-fukuoka.yml"
      - "tools/fetch_fukuoka.py"
permissions:
  contents: write
concurrency:
  group: update-fukuoka
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_fukuoka.py
      - name: 変わっていたら保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fukuoka-cvs.json
          if git diff --cached --quiet; then echo "変更なし"; else git commit -m "福岡県のコンビニデータを更新" && git push; fi
