name: 月間ランキングと入荷の傾向を更新
on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *" # 6時間ごと（日本時間 3:07 / 9:07 / 15:07 / 21:07）
  push:
    branches: [main]
    paths:
      - "scripts/ranking.mjs"
      - ".github/workflows/ranking.yml"
permissions:
  contents: write
concurrency:
  group: ranking
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: ランキングを集計
        run: node scripts/ranking.mjs
      - name: 変わっていたら保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/ranking.json data/trends.json data/stats.json data/trust.json sitemap.xml robots.txt area; do [ -f "$f" ] && git add "$f"; done; true
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "月間ランキングを更新"
          git pull --rebase origin main
          git push
