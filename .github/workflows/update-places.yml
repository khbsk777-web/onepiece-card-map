name: 福岡県のお店データを更新
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 毎日 午前3時（日本時間）
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-places.yml"
      - "scripts/fetch_places.py"
permissions:
  contents: write
concurrency:
  group: update-places
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: お店データを取得
        run: python3 scripts/fetch_places.py
      - name: 変わっていたら保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fukuoka.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "福岡県のお店データを更新"
          git pull --rebase origin main
          git push
