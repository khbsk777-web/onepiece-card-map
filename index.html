<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://www.google.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cyberjapandata.gsi.go.jp; connect-src 'self' https://*.googleapis.com https://nominatim.openstreetmap.org https://overpass-api.de https://overpass.kumi.systems https://raw.githubusercontent.com https://www.google.com https://www.recaptcha.net; frame-src https://*.firebaseapp.com https://www.google.com https://www.recaptcha.net; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#14213d">
<meta name="description" content="トレジャーカードマップ：ワンピースカードの入荷・在庫情報をみんなで共有する非公式マップ">
<title>トレジャーカードマップ（非公式）</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="トレジャーカードマップ">
<meta property="og:title" content="トレジャーカードマップ｜ワンピースカードの在庫をみんなで報告する地図（非公式）">
<meta property="og:description" content="コンビニ・本屋・ヨドバシなどのワンピースカード入荷・在庫情報を、地図でサクッと報告＆チェック。無料・非公式。">
<meta property="og:url" content="https://khbsk777-web.github.io/onepiece-card-map/">
<meta property="og:image" content="https://khbsk777-web.github.io/onepiece-card-map/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="トレジャーカードマップ｜ワンピースカードの在庫マップ（非公式）">
<meta name="twitter:description" content="コンビニ・本屋・ヨドバシなどの入荷・在庫情報を、地図でみんなで報告＆チェック。">
<meta name="twitter:image" content="https://khbsk777-web.github.io/onepiece-card-map/og.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="トレカマップ">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">⚓ トレジャーカードマップ<span class="tag">非公式</span></div>
  <div class="top-actions"><a class="pill icon" href="about.html" aria-label="このアプリについて">ℹ️</a><button id="accountBtn" class="pill" type="button">ログイン</button></div>
</header>

<div class="filters" role="toolbar" aria-label="絞り込み">
  <select id="placesMode" class="chip-select" aria-label="周辺のお店の表示"><option value="all">🏪 周辺：全部</option><option value="conv">🏪 コンビニだけ</option><option value="off">周辺：かくす</option></select>
  <button class="chip on" data-f="all" type="button">すべて</button>
  <button class="chip" data-f="stock" type="button">🟢 在庫あり</button>
  <button class="chip" data-f="today" type="button">🕒 今日の情報</button>
  <select id="productFilter" class="chip-select" aria-label="商品で絞り込み"></select>
  <select id="prefFilter" class="chip-select" aria-label="都道府県で絞り込み"><option value="">全国</option></select>
</div>

<main id="map" aria-label="地図"></main>

<div id="modeBanner" class="mode-banner" hidden>
  <span>📍 地図をタップしてお店の場所を選んでね</span>
  <button id="modeCancel" type="button">やめる</button>
</div>

<div class="fabs">
  <button id="locateBtn" class="fab light" type="button">📍 現在地</button>
  <button id="feedBtn" class="fab small" type="button" aria-label="新着情報">🆕</button>
  <button id="addStoreBtn" class="fab" type="button">＋ お店を登録</button>
</div>

<details class="legend"><summary>🗺 凡例</summary><div class="lg-body">
  <span><i class="dot in"></i>あり</span><span><i class="dot low"></i>わずか</span><span><i class="dot out"></i>売切</span><span><i class="dot soon"></i>入荷予定</span><span><i class="dot na"></i>取り扱いなし</span><span><i class="dot none"></i>情報なし/古い</span><span><b class="cvs mini">セブン</b> コンビニ（拡大で表示）</span><span>📚🏬🃏 その他のお店</span><span class="lg-title">報告なしのお店</span><span><i class="dot" style="background:#111"></i>コンビニ（全国）</span><span><i class="dot" style="background:#ea580c"></i>ヨドバシカメラ</span><span><i class="dot" style="background:#0d9488"></i>本屋（福岡県）</span><span><i class="dot" style="background:#7c3aed"></i>商業施設</span><span><i class="dot" style="background:#db2777"></i>カード・ホビー店</span><span class="lg-title">投稿できる範囲</span><span><i class="dot" style="background:#22c55e33;border:2px dashed #16a34a"></i>緑の円＝現在地から3km</span>
</div></details>

<!-- 下から出てくるパネル（中身はJSで作る） -->
<section id="sheet" class="sheet" hidden aria-live="polite">
  <button class="sheet-close" type="button" aria-label="閉じる">×</button>
  <div id="sheetBody"></div>
</section>

<div id="toast" class="toast" role="status" hidden></div>
<div id="demoNote" class="demo-note" hidden>デモモード：データはこの端末の中だけに保存されます</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
